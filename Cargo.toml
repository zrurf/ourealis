[workspace]
resolver = "3"
members = ["crates/core", "crates/map-format", "crates/service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
approx = "0.5.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
glam = { version = "0.33.7", features = ["serde"] }
half = "2.7.1"
include_dir = "0.7.4"
lz4_flex = "0.14.0"
mimalloc = "0.1.52"
ourealis-core = { path = "crates/core", version = "0.1.0" }
ourealis-map-format = { path = "crates/map-format", version = "0.1.0" }
parking_lot = "0.12.5"
pollster = "1.0.1"
proptest = "1.11.0"
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
rand = "0.10.2"
rand_chacha = "0.10.0"
rayon = "1.12.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
toml = "1.1.6"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "trace", "compression-gzip", "cors", "request-id", "limit", "set-header"
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
twox-hash = "2.1.4"
uuid = { version = "1.26.1", features = ["v4", "v5", "serde"] }
wgpu = { version = "30.0.1", default-features = false, features = [
    "vulkan", "metal", "dx12", "serde", "spirv", "wgsl", "wgpu-core", "parking_lot", "std"
]}
zstd = "0.14.0"
