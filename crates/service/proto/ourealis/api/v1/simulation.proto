// Simulation jobs: submission, progress and result streaming.

syntax = "proto3";

package ourealis.api.v1;

import "ourealis/api/v1/common.proto";

// Lifecycle state of a job.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // Waiting for a worker slot.
  JOB_STATE_QUEUED = 1;
  // Running; see `stage` for how far it has come.
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

// One submitted simulation.
message SubmitRequest {
  // Request body as JSON, laid out exactly like the HTTP `POST
  // /api/v1/simulations` body. One JSON payload keeps the two facades from
  // drifting: the nested simulation configuration has dozens of optional fields
  // and mirroring them by hand would add a second place to keep in sync.
  string request_json = 1;
}

message SubmitReply {
  string id = 1;
  JobState state = 2;
}

message GetSimulationRequest {
  string id = 1;
}

// State of one job.
message SimulationState {
  string id = 1;
  JobState state = 2;
  // Pipeline stage the job is in: "queued", "environment", "planning",
  // "motion", "sensors", "metrics", "done".
  string stage = 3;
  // Fraction of the run completed, 0 to 1. Unset while the service cannot say:
  // the simulator's run is one call, so a running job reports no fraction and a
  // client shows elapsed time instead.
  optional double progress = 4;
  // Wall-clock time the job has been running, seconds; unset while queued.
  optional double elapsed_s = 13;
  // Job name, when one was given.
  string name = 5;
  // Failure message, empty unless the state is failed.
  string error = 6;
  // Error kind, empty unless the state is failed.
  string error_kind = 7;
  int64 created_at_unix_ms = 8;
  int64 started_at_unix_ms = 9;
  int64 finished_at_unix_ms = 10;
  // Map the run used.
  string map_id = 11;
  // Planning mode: "standard", "loop" or "dynamic".
  string mode = 12;
}

message ListSimulationsRequest {
  uint32 offset = 1;
  uint32 limit = 2;
}

message ListSimulationsReply {
  repeated SimulationState items = 1;
  uint32 total = 2;
}

message CancelRequest {
  string id = 1;
}

// Progress and log events of a job, identical to the SSE stream.
message Event {
  // "state", "stage", "log", "done" or "error".
  string type = 1;
  // Event payload as JSON, shaped like the corresponding HTTP event.
  string data_json = 2;
  // Server time of the event, Unix milliseconds.
  int64 at_unix_ms = 3;
}

message WatchRequest {
  string id = 1;
  // Topics to forward; empty means state, stage and log, but not the result
  // samples.
  repeated string topics = 2;
}

// Ground truth at one sample.
message TruthSample {
  double time_s = 1;
  Vec2 position = 2;
  Vec2 position_low = 3;
  double z = 4;
  double terrain_z = 5;
  double speed = 6;
  double heading = 7;
  double head_heading = 8;
  double pitch = 9;
  double roll = 10;
  double kappa_eff = 11;
  double offset_m = 12;
  double grade = 13;
  bool standing = 14;
  bool turning = 15;
  repeated double velocity = 16;
  repeated double acceleration = 17;
}

// One sample of a sensor stream. The three-vector channels use `v`; the scalar
// ones use the named fields, and unused fields stay zero.
message SensorSample {
  double time_s = 1;
  // Channel: "gnss", "accel", "gyro", "mag" or "baro".
  string channel = 2;
  repeated double v = 3;
  // GNSS only.
  double latitude_deg = 4;
  double longitude_deg = 5;
  double altitude_m = 6;
  double speed_mps = 7;
  double heading_rad = 8;
  bool valid = 9;
  uint32 satellites = 10;
  // Barometer only.
  double pressure_pa = 11;
}

// Request for a page of a sample stream.
message StreamRequest {
  string id = 1;
  // Channel for `Sensors`: "gnss", "accel", "gyro", "mag" or "baro".
  string channel = 2;
  uint32 offset = 3;
  // Maximum number of samples in this reply or stream frame.
  uint32 limit = 4;
}

message TruthPage {
  repeated TruthSample items = 1;
  uint32 total = 2;
  uint32 offset = 3;
}

message SensorPage {
  repeated SensorSample items = 1;
  uint32 total = 2;
  uint32 offset = 3;
}

message SummaryRequest {
  string id = 1;
}

// Manifest, metrics and route summary of a finished job, as JSON.
message SummaryReply {
  string summary_json = 1;
}

// A route preview: planning only, no motion or sensors.
message RoutePreviewRequest {
  string request_json = 1;
}

message RoutePreviewReply {
  // Preview payload as JSON: candidate paths with cost, length, selection
  // probability and geometry.
  string preview_json = 1;
}

service SimulationService {
  rpc Submit(SubmitRequest) returns (SubmitReply);
  rpc List(ListSimulationsRequest) returns (ListSimulationsReply);
  rpc Get(GetSimulationRequest) returns (SimulationState);
  rpc Cancel(CancelRequest) returns (Empty);
  // Server-side stream of progress and log events.
  rpc Watch(WatchRequest) returns (stream Event);
  rpc Summary(SummaryRequest) returns (SummaryReply);
  // Ground truth streamed in frames of `limit` samples.
  rpc Truth(StreamRequest) returns (stream TruthSample);
  // One sensor channel streamed in frames of `limit` samples.
  rpc Sensors(StreamRequest) returns (stream SensorSample);
  rpc Preview(RoutePreviewRequest) returns (RoutePreviewReply);
}
